[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-bim-parser"
version = "3.0.0"
description = "Production-grade CAD/BIM parsing for Enterprise CAFM Platform"
requires-python = ">=3.11"
authors = [
    {name = "CAFM Engineering", email = "engineering@cafm.local"},
]
license = {text = "Proprietary"}
keywords = ["cadm", "bim", "dxf", "dwg", "ifc", "shapely", "ezdxf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "ezdxf>=1.1.0",
    "shapely>=2.0.0",
    "firebase-functions>=2.5.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-firestore>=2.14.0",
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.7.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "N"]
